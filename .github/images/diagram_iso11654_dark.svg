<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Single-number sound-absorption rating (ISO 11654)</text><rect x="118.0" y="46" width="664.0" height="54.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Measured  </tspan><tspan font-style="italic">α</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">s</tspan><tspan dy="-4.0">  at one-third octaves, 200 Hz to 5000 Hz</tspan></text><text x="450.0" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">from a reverberation room (ISO 354)</text><line x1="450.0" y1="100" x2="450.0" y2="119.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 128.0 L 446.4 119.0 L 453.6 119.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="118.0" y="128" width="664.0" height="54.0" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Practical  </tspan><tspan font-style="italic">α</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">p</tspan><tspan dy="-3.7">  per octave band, 250 Hz to 4000 Hz  (Clause 4.1)</tspan></text><text x="450.0" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">mean of the three one-third octaves, rounded to 0.05</text><rect x="118.0" y="206" width="664.0" height="54.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">Shift the reference curve in 0.05 steps to best fit  (Clause 4.2)</text><text x="450.0" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">sum of unfavourable deviations kept ≤ 0.10</text><rect x="118.0" y="284" width="664.0" height="54.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Weighted coefficient  </tspan><tspan font-style="italic">α</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">w</tspan><tspan dy="-3.7"> = shifted reference at 500 Hz</tspan></text><text x="450.0" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle"></text><rect x="118.0" y="362" width="664.0" height="54.0" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="450.0" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Shape indicators (L, M, H) where  </tspan><tspan font-style="italic">α</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">p</tspan><tspan dy="-3.7"> − reference ≥ 0.25</tspan></text><text x="450.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle"></text><line x1="450.0" y1="100" x2="450.0" y2="119.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 128.0 L 446.4 119.0 L 453.6 119.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="182" x2="450.0" y2="197.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 206.0 L 446.4 197.0 L 453.6 197.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="260" x2="450.0" y2="275.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 284.0 L 446.4 275.0 L 453.6 275.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="338" x2="450.0" y2="353.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 362.0 L 446.4 353.0 L 453.6 353.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="416" x2="450.0" y2="435.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 444.0 L 446.4 435.0 L 453.6 435.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="118.0" y="444" width="664.0" height="58" rx="10" fill="none" stroke="#4da3d8" stroke-width="2.4"/><text x="450.0" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">Sound absorption class  A to E   (Table B.1, Annex B)</text><text x="450.0" y="489" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>or “Not classified” when </tspan><tspan font-style="italic">α</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">w</tspan><tspan dy="-2.9"> falls below the class-E band</tspan></text></svg>