ight="62.0" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="668.0" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">RC Mark II  (Anexo D)</text><text x="668.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">curvas de −5 dB/octava</text><rect x="482.0" y="256" width="372.0" height="62.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="668.0" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">L</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">MF</tspan><tspan dy="-4.0"> = (</tspan><tspan font-style="italic">L</tspan><tspan dy="4.0" font-size="12.6">500</tspan><tspan dy="-4.0"> + </tspan><tspan font-style="italic">L</tspan><tspan dy="4.0" font-size="12.6">1000</tspan><tspan dy="-4.0"> + </tspan><tspan font-style="italic">L</tspan><tspan dy="4.0" font-size="12.6">2000</tspan><tspan dy="-4.0">) / 3</tspan></text><text x="668.0" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>RC = redondeo(</tspan><tspan font-style="italic">L</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">MF</tspan><tspan dy="-3.1">)   (cláusula D.4)</tspan></text><line x1="668.0" y1="220" x2="668.0" y2="247.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 668.0 256.0 L 664.4 247.0 L 671.6 247.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="668.0" y1="318" x2="668.0" y2="345.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 668.0 354.0 L 664.4 345.0 L 671.6 345.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="482.0" y="354" width="372.0" height="116" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="668.0" y="379" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Etiqueta espectral  (cláusula D.3)</text><text x="500.0" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">R  retumbo: una banda ≤ 500 Hz supera RC en &gt; 5 dB</text><text x="500.0" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">H  siseo: una banda ≥ 1000 Hz supera RC en &gt; 3 dB</text><text x="500.0" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">N  neutro: dentro de ambas tolerancias</text><line x1="668.0" y1="470" x2="668.0" y2="481.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 668.0 490.0 L 664.4 481.0 L 671.6 481.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="482.0" y="490" width="372.0" height="58" rx="10" fill="none" stroke="#e46a6a" stroke-width="2.4"/><text x="668.0" y="525" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#e6e6e6" text-anchor="middle" font-weight="600">RC-NN(A)</text></svg>