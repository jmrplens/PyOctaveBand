<svg xmlns="http://www.w3.org/2000/svg" width="900" height="616" viewBox="0 0 900 616"><rect width="900" height="616" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Edificio resuelto del anexo L (ISO 12354-1): elementos, uniones y vías</text><text x="240.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">Sección: dos viviendas superpuestas</text><rect x="86.0" y="112.0" width="24.0" height="240.0" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.0"/><rect x="370.0" y="112.0" width="24.0" height="240.0" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.0"/><rect x="264.0" y="112.0" width="24.0" height="240.0" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.0"/><rect x="110.0" y="222.0" width="260.0" height="20.0" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.2"/><rect x="110.0" y="210.0" width="260.0" height="5" rx="0.0" fill="#2ca02c" stroke="#1a1a1a" stroke-width="1.0"/><rect x="110.0" y="215.0" width="260.0" height="7" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.0"/><text x="240.0" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">vivienda emisora</text><text x="240.0" y="310.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">vivienda receptora</text><circle cx="98.0" cy="232.0" r="11.0" fill="#ffffff" stroke="#d62728" stroke-width="2.4"/><text x="98.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#d62728" text-anchor="middle" font-weight="600">T</text><circle cx="382.0" cy="232.0" r="11.0" fill="#ffffff" stroke="#d62728" stroke-width="2.4"/><text x="382.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#d62728" text-anchor="middle" font-weight="600">T</text><circle cx="276.0" cy="232.0" r="11.0" fill="#ffffff" stroke="#d62728" stroke-width="2.4"/><text x="276.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#d62728" text-anchor="middle" font-weight="600">X</text><text x="46.0" y="368.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="start" xml:space="preserve"><tspan>T  T rígida (forjado a muro exterior): </tspan><tspan font-style="italic">K</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">ij</tspan><tspan dy="-3.3"> = 6,4 / 11,2 dB</tspan></text><text x="46.0" y="390.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="start" xml:space="preserve"><tspan>X  cruz rígida (forjado a tabique interior): </tspan><tspan font-style="italic">K</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">ij</tspan><tspan dy="-3.3"> = 8,8 / 11,0 dB</tspan></text><text x="46.0" y="418.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan>forjado separador  hormigón de 220 mm, 484 kg/m², </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">c</tspan><tspan dy="-3.1"> = 76,8 Hz</tspan></text><text x="46.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2ca02c" text-anchor="start" xml:space="preserve"><tspan>sobre él  solera de 35 mm, 73,5 kg/m², sobre </tspan><tspan font-style="italic">s</tspan><tspan>′ = 8 MN/m³</tspan></text><text x="46.0" y="462.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" xml:space="preserve"><tspan>muros exteriores  hormigón celular de 365 mm, 219 kg/m², </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">c</tspan><tspan dy="-3.1"> = 92,6 Hz</tspan></text><text x="46.0" y="484.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" xml:space="preserve"><tspan>tabiques interiores  silicocalcáreo de 200 mm, 360 kg/m², </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">c</tspan><tspan dy="-3.1"> = 128,4 Hz</tspan></text><text x="680.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">Planta: el forjado separador</text><rect x="546.0" y="150.0" width="268.0" height="214.0" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.4"/><rect x="546.0" y="143.0" width="268.0" height="7" rx="0.0" fill="#d62728" stroke="#1a1a1a" stroke-width="1.0"/><rect x="546.0" y="364.0" width="268.0" height="7" rx="0.0" fill="#d62728" stroke="#1a1a1a" stroke-width="1.0"/><rect x="539.0" y="150.0" width="7" height="214.0" rx="0.0" fill="#d62728" stroke="#1a1a1a" stroke-width="1.0"/><rect x="814.0" y="150.0" width="7" height="214.0" rx="0.0" fill="#d62728" stroke="#1a1a1a" stroke-width="1.0"/><text x="680.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan> = 20 m²</tspan></text><text x="680.0" y="279.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">5,00 m × 4,00 m</text><line x1="676.0" y1="390.0" x2="555.0" y2="390.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 546.0 390.0 L 555.0 386.4 L 555.0 393.6 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="684.0" y1="390.0" x2="805.0" y2="390.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 814.0 390.0 L 805.0 393.6 L 805.0 386.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="680.0" y="383.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">5,00 m</text><line x1="520.0" y1="253.0" x2="520.0" y2="159.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 520.0 150.0 L 523.6 159.0 L 516.4 159.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="520.0" y1="261.0" x2="520.0" y2="355.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 520.0 364.0 L 516.4 355.0 L 523.6 355.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="511.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="end">4,00 m</text><text x="680.0" y="132.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle">muro exterior (T)</text><text x="680.0" y="426.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle">tabique interior (X)</text><text x="680.0" y="456.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">dos muros exteriores y dos interiores llegan al forjado, con</text><text x="680.0" y="478.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">5,00 m de unión en cada borde largo y 4,00 m en</text><text x="680.0" y="500.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="middle">cada borde corto: suma del perímetro 9 m exterior + 9 m interior</text><rect x="40" y="508" width="820" height="84" rx="10" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,5"/><text x="450" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">13 vías aéreas = 1 directa (Dd) + 4 elementos de flanco × 3 ramas (Ff, Df, Fd)</text><text x="450" y="564" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f77b4" text-anchor="middle">5 vías de impacto = 1 directa + 4 Df: solo se excita el forjado, así que no hay Ff ni Fd</text></svg>